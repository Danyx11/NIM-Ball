<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Bubble module preview</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  #stage { display: block; margin: 0 auto; }
  #controls {
    position: fixed; top: 12px; left: 12px;
    font: 14px/1.4 system-ui, sans-serif; color: #fff;
    background: rgba(0,0,0,0.55); padding: 10px 14px; border-radius: 8px;
    user-select: none;
  }
  #controls label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
</style>
</head>
<body>
  <div id="controls">
    <label><input type="checkbox" id="toggleIdenticon" checked /> Identicon dans l'hexagone</label>
  </div>
  <canvas id="stage" width="1200" height="905" style="width:1200px;height:905px"></canvas>

<script type="module">
import { getIdenticonCanvas } from '../src/identicons.js';

// Same demo addresses / module art as src/game.js, so this preview matches
// the real in-game bubble bake exactly (compare against startGame()'s
// bakeBubble if either drifts).
const IDENTICON_ADDRESS = {
  A: 'NQ16 2SSN 82TL SMQS KXT3 Q01V CMAL NU6F 1LJG',
  B: 'NQ19 AXEU PPQ9 5610 YF48 VLTJ QR6Y 0HS1 UH89',
};
const MODULE_SRC = { A: '/identicons/module-navy-v4-light.png', B: '/identicons/module-gold-v4-light.png' };

function downscaleToFit(src, targetW, targetH) {
  let cur = src, cw = src.width, ch = src.height;
  while (cw > targetW * 2 && ch > targetH * 2) {
    const nw = Math.round(cw / 2), nh = Math.round(ch / 2);
    const step = document.createElement('canvas');
    step.width = nw; step.height = nh;
    const sctx = step.getContext('2d');
    sctx.imageSmoothingEnabled = true; sctx.imageSmoothingQuality = 'high';
    sctx.drawImage(cur, 0, 0, nw, nh);
    cur = step; cw = nw; ch = nh;
  }
  const out = document.createElement('canvas');
  out.width = targetW; out.height = targetH;
  const octx = out.getContext('2d');
  octx.imageSmoothingEnabled = true; octx.imageSmoothingQuality = 'high';
  octx.drawImage(cur, 0, 0, targetW, targetH);
  return out;
}

// hex slot on the module art (module-navy-v4-light.png / module-gold-v4-light.png,
// real alpha), measured as a fraction of the module's own square canvas — kept
// in sync with the HEX constant in src/game.js.
const HEX = { cxFrac: 0.499, cyFrac: 0.498, halfWFrac: 0.235, halfHFrac: 0.205 };
function hexPath(hctx, cx, cy, halfW, halfH) {
  hctx.beginPath();
  hctx.moveTo(cx + halfW, cy);
  hctx.lineTo(cx + halfW * 0.5, cy - halfH);
  hctx.lineTo(cx - halfW * 0.5, cy - halfH);
  hctx.lineTo(cx - halfW, cy);
  hctx.lineTo(cx - halfW * 0.5, cy + halfH);
  hctx.lineTo(cx + halfW * 0.5, cy + halfH);
  hctx.closePath();
}

// Bakes the module ring with its hex slot punched transparent. `id` is
// optional: when provided, the identicon is drawn into the hex before the
// ring is composited back on top — omit it to preview the ring alone (the
// "without identicon" comparison state).
function bakeBubble(mod, id, diameterPx) {
  const S = Math.round(diameterPx * 2);
  const cx = S * HEX.cxFrac, cy = S * HEX.cyFrac;
  const halfW = S * HEX.halfWFrac, halfH = S * HEX.halfHFrac;

  const sizedModule = downscaleToFit(mod, S, S);
  const punched = document.createElement('canvas');
  punched.width = S; punched.height = S;
  const pctx = punched.getContext('2d');
  pctx.drawImage(sizedModule, 0, 0);
  pctx.globalCompositeOperation = 'destination-out';
  hexPath(pctx, cx, cy, halfW, halfH);
  pctx.fill();

  const bubble = document.createElement('canvas');
  bubble.width = S; bubble.height = S;
  const bctx = bubble.getContext('2d');
  bctx.imageSmoothingEnabled = true; bctx.imageSmoothingQuality = 'high';

  if (id) {
    const fit = Math.max(halfW * 2, halfH * 2) * 1.05;
    const scale = fit / Math.max(id.width, id.height);
    const dw = Math.round(id.width * scale), dh = Math.round(id.height * scale);
    const sizedIdenticon = downscaleToFit(id, dw, dh);
    bctx.save();
    hexPath(bctx, cx, cy, halfW, halfH);
    bctx.clip();
    bctx.drawImage(sizedIdenticon, cx - dw / 2, cy - dh / 2);
    bctx.restore();
  }

  bctx.drawImage(punched, 0, 0);
  return bubble;
}

function loadImg(src) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.src = src;
  });
}

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');

// the canvas backing store was only 1200x905 device pixels, so on a Retina
// display (devicePixelRatio 2-3x) the browser had to upscale every frame to
// fill the physical screen — that's what read as "blurry", independent of
// how carefully the bubble sprite itself was downscaled.
const DPR = window.devicePixelRatio || 1;
const CSS_W = 1200, CSS_H = 905;
canvas.width = CSS_W * DPR;
canvas.height = CSS_H * DPR;
ctx.scale(DPR, DPR);

// matches src/game.js's GLOB_R * 2 (34.2 * 2 = 68.4). Baked at DPR-multiplied
// resolution so the sprite has as many source pixels as the display can
// actually show.
const DISPLAY_SIZE = 68.4;
const posA = [370 - DISPLAY_SIZE / 2, 490 - DISPLAY_SIZE / 2];
const posB = [830 - DISPLAY_SIZE / 2, 490 - DISPLAY_SIZE / 2];

function drawGroundShadow(x, y, size) {
  ctx.beginPath();
  ctx.ellipse(x + size * 0.55, y + size * 0.58, size * 0.5, size * 0.46, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.filter = 'blur(3px)';
  ctx.fill();
  ctx.filter = 'none';
}

(async () => {
  const [arena, modA, modB, idACanvas, idBCanvas] = await Promise.all([
    loadImg('/arena/frame.webp'),
    loadImg(MODULE_SRC.A),
    loadImg(MODULE_SRC.B),
    getIdenticonCanvas(IDENTICON_ADDRESS.A),
    getIdenticonCanvas(IDENTICON_ADDRESS.B),
  ]);

  // team B starts on the right side of the pitch, so mirror it to face the
  // ball at kickoff instead of away from it — same as src/game.js.
  const flipped = document.createElement('canvas');
  flipped.width = idBCanvas.width; flipped.height = idBCanvas.height;
  const fctx = flipped.getContext('2d');
  fctx.translate(flipped.width, 0);
  fctx.scale(-1, 1);
  fctx.drawImage(idBCanvas, 0, 0);

  const checkbox = document.getElementById('toggleIdenticon');

  function render() {
    const withIdenticon = checkbox.checked;
    const bubbleA = bakeBubble(modA, withIdenticon ? idACanvas : null, DISPLAY_SIZE * DPR);
    const bubbleB = bakeBubble(modB, withIdenticon ? flipped : null, DISPLAY_SIZE * DPR);

    ctx.clearRect(0, 0, CSS_W, CSS_H);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(arena, 0, 0, CSS_W, CSS_H);
    drawGroundShadow(...posA, DISPLAY_SIZE);
    drawGroundShadow(...posB, DISPLAY_SIZE);
    ctx.drawImage(bubbleA, ...posA, DISPLAY_SIZE, DISPLAY_SIZE);
    ctx.drawImage(bubbleB, ...posB, DISPLAY_SIZE, DISPLAY_SIZE);
  }

  checkbox.addEventListener('change', render);
  render();
})();
</script>
</body>
</html>
