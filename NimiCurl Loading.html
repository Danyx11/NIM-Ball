    height:clamp(90px,16vmin,160px);
    display:block;

    text-transform:uppercase;
  }
  .dots span{
    animation: blink 1.4s infinite;
  }
  .dots span:nth-child(2){ animation-delay:.2s; }
  .dots span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{
    0%, 20%   { opacity:0; }
    50%       { opacity:1; }
    100%      { opacity:0; }
  }
  .orb{
    filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 8px #fff);
    animation: orb-fade 2.5s linear infinite;
  }
  @keyframes orb-fade{
    0%, 52%   { opacity:1; }

<div class="wrap">
  <svg class="logo" viewBox="0 0 544 544" xmlns="http://www.w3.org/2000/svg">

    <!-- Chemin invisible complet (avec traversée de l'ouverture), guide de la bille -->
    <path id="hexGuide" fill="none" stroke="none"
          d="M147,222 L147,191 L279,115 L411,191 L411,344 L279,420 L147,344 L147,339 Z"/>

    <!-- Hexagone visible -->
    <path d="M147,222 L147,191 L279,115 L411,191 L411,344 L279,420 L147,344 L147,339"
          fill="none" stroke="#fff" stroke-width="14"
          stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Lignes de vitesse -->
    <line x1="60"  y1="250" x2="177" y2="250" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
    <line x1="82"  y1="278" x2="169" y2="278" stroke="#fff" stroke-width="9"  stroke-linecap="round"/>
    <line x1="108" y1="307" x2="184" y2="307" stroke="#fff" stroke-width="9"  stroke-linecap="round"/>

    <!-- Capsule centrale -->
    <rect x="189" y="231" width="182" height="86" rx="43" ry="43"
          fill="none" stroke="#fff" stroke-width="15"/>

    <!-- Bille lumineuse : 1.5s de course, puis respiration 1s avant de recommencer -->
    <circle class="orb" r="13" fill="#fff">
      <animateMotion dur="2.5s" repeatCount="indefinite" rotate="auto"
                     keyPoints="0;1;1" keyTimes="0;0.6;1" calcMode="linear">
        <mpath href="#hexGuide"/>
      </animateMotion>
    </circle>

  </svg>

  <div class="label">Loading<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
